<div style="font-family: Arial, Helvetica, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #243b36;">
  <h2 style="margin: 0 0 12px; font-size: 20px;">Tu código de verificación</h2>
  <p style="margin: 0 0 16px; font-size: 14px; color: #65736e;">
    Usa este código para verificar tu correo y continuar con tu cita:
  </p>
  <p style="margin: 0 0 16px; font-size: 32px; font-weight: bold; letter-spacing: 6px;">
    {{ .Token }}
  </p>
  <p style="margin: 0; font-size: 12px; color: #65736e;">
    El código vence en pocos minutos. Si no lo pediste, ignora este correo.
  </p>
</div>
